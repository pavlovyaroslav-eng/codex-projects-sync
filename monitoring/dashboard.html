<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Infrastructure Monitoring Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .last-update {
            color: #b0c4de;
            font-size: 0.9em;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #4CAF50;
            color: white;
        }

        .btn-primary:hover {
            background: #45a049;
        }

        .btn-secondary {
            background: #2196F3;
            color: white;
        }

        .btn-secondary:hover {
            background: #0b7dda;
        }

        .servers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .server-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .server-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .server-name {
            font-size: 1.5em;
            font-weight: bold;
        }

        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .status-online {
            background: #4CAF50;
        }

        .status-offline {
            background: #f44336;
        }

        .status-warning {
            background: #ff9800;
        }

        .metric-group {
            margin-bottom: 20px;
        }

        .metric-title {
            font-size: 1.1em;
            color: #b0c4de;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .metric-label {
            color: #ddd;
        }

        .metric-value {
            font-weight: bold;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }

        .progress-fill {
            height: 100%;
            transition: width 0.3s;
        }

        .progress-ok {
            background: #4CAF50;
        }

        .progress-warn {
            background: #ff9800;
        }

        .progress-danger {
            background: #f44336;
        }

        .service-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .service-item {
            padding: 8px;
            border-radius: 5px;
            text-align: center;
            font-size: 0.9em;
        }

        .service-active {
            background: rgba(76, 175, 80, 0.3);
            border: 1px solid #4CAF50;
        }

        .service-inactive {
            background: rgba(244, 67, 54, 0.3);
            border: 1px solid #f44336;
        }

        .port-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .port-item {
            padding: 5px 12px;
            border-radius: 5px;
            font-size: 0.9em;
            background: rgba(76, 175, 80, 0.3);
            border: 1px solid #4CAF50;
        }

        .port-critical {
            background: rgba(255, 152, 0, 0.3);
            border: 1px solid #ff9800;
            font-weight: bold;
        }

        .error-message {
            background: rgba(244, 67, 54, 0.3);
            border: 1px solid #f44336;
            border-radius: 5px;
            padding: 15px;
            margin-top: 10px;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.5em;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔒 VPN Infrastructure Monitoring</h1>
        <div class="last-update" id="lastUpdate">Loading...</div>
    </div>

    <div class="controls">
        <button class="btn btn-primary" onclick="loadReports()">🔄 Refresh Data</button>
        <button class="btn btn-secondary" onclick="toggleAutoRefresh()">⏱️ Auto-Refresh: <span id="autoRefreshStatus">OFF</span></button>
        <input type="file" id="fileInput" accept=".json" multiple style="display: none" onchange="handleFileUpload(event)">
        <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">📁 Load Reports</button>
    </div>

    <div id="serversContainer" class="servers-grid">
        <div class="loading">
            <div class="spinner"></div>
            <p>Waiting for monitoring data...</p>
            <p style="font-size: 0.8em; margin-top: 10px;">
                Drop JSON report files here or click "Load Reports"
            </p>
        </div>
    </div>

    <script>
        let autoRefreshInterval = null;
        let monitoringData = {};

        // Enable drag and drop
        document.addEventListener('DOMContentLoaded', () => {
            const body = document.body;

            body.addEventListener('dragover', (e) => {
                e.preventDefault();
                body.style.background = 'linear-gradient(135deg, #2a5298 0%, #1e3c72 100%)';
            });

            body.addEventListener('dragleave', () => {
                body.style.background = 'linear-gradient(135deg, #1e3c72 0%, #2a5298 100%)';
            });

            body.addEventListener('drop', (e) => {
                e.preventDefault();
                body.style.background = 'linear-gradient(135deg, #1e3c72 0%, #2a5298 100%)';

                const files = Array.from(e.dataTransfer.files).filter(f => f.name.endsWith('.json'));
                if (files.length > 0) {
                    handleFiles(files);
                }
            });

            // Try to load from monitoring-reports folder if available
            checkForReports();
        });

        function handleFileUpload(event) {
            const files = Array.from(event.target.files);
            handleFiles(files);
        }

        async function handleFiles(files) {
            for (const file of files) {
                try {
                    const text = await file.text();
                    const data = JSON.parse(text);
                    monitoringData[data.hostname] = data;
                } catch (error) {
                    console.error('Error reading file:', file.name, error);
                }
            }
            renderDashboard();
        }

        async function checkForReports() {
            // This would need server-side support to actually work
            // For now, users need to drag-drop or select files manually
        }

        function loadReports() {
            document.getElementById('fileInput').click();
        }

        function toggleAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
                document.getElementById('autoRefreshStatus').textContent = 'OFF';
            } else {
                autoRefreshInterval = setInterval(checkForReports, 10000); // 10 seconds
                document.getElementById('autoRefreshStatus').textContent = 'ON';
            }
        }

        function getProgressClass(percentage) {
            if (percentage < 70) return 'progress-ok';
            if (percentage < 85) return 'progress-warn';
            return 'progress-danger';
        }

        function parsePercentage(str) {
            const match = str.match(/(\d+\.?\d*)/);
            return match ? parseFloat(match[1]) : 0;
        }

        function renderDashboard() {
            const container = document.getElementById('serversContainer');
            const servers = Object.values(monitoringData);

            if (servers.length === 0) {
                container.innerHTML = '<div class="loading"><p>No data loaded. Please upload monitoring reports.</p></div>';
                return;
            }

            document.getElementById('lastUpdate').textContent = `Last Update: ${new Date().toLocaleString()}`;

            container.innerHTML = servers.map(server => {
                const memoryUsage = parsePercentage(server.system.memory.usage);
                const diskUsage = parsePercentage(server.system.disk.usage);
                const cpuUsage = parsePercentage(server.system.cpu_usage);

                const failedServices = server.services.failed_count > 0;
                const statusClass = failedServices ? 'status-warning' : 'status-online';
                const statusText = failedServices ? 'Warning' : 'Online';

                return `
                    <div class="server-card">
                        <div class="server-header">
                            <div class="server-name">${server.hostname}</div>
                            <div class="status-badge ${statusClass}">${statusText}</div>
                        </div>

                        <div class="metric-group">
                            <div class="metric-title">⚙️ System Resources</div>

                            <div class="metric-row">
                                <span class="metric-label">Uptime</span>
                                <span class="metric-value">${server.system.uptime}</span>
                            </div>

                            <div class="metric-row">
                                <span class="metric-label">CPU Usage</span>
                                <span class="metric-value">${server.system.cpu_usage}</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill ${getProgressClass(cpuUsage)}" style="width: ${cpuUsage}%"></div>
                            </div>

                            <div class="metric-row">
                                <span class="metric-label">Memory</span>
                                <span class="metric-value">${server.system.memory.used} / ${server.system.memory.total}</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill ${getProgressClass(memoryUsage)}" style="width: ${memoryUsage}%"></div>
                            </div>

                            <div class="metric-row">
                                <span class="metric-label">Disk</span>
                                <span class="metric-value">${server.system.disk.used} / ${server.system.disk.total}</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill ${getProgressClass(diskUsage)}" style="width: ${diskUsage}%"></div>
                            </div>

                            <div class="metric-row">
                                <span class="metric-label">Load Average</span>
                                <span class="metric-value">${server.system.load}</span>
                            </div>
                        </div>

                        <div class="metric-group">
                            <div class="metric-title">🔧 Services</div>
                            ${server.services.failed_count > 0 ?
                                `<div class="error-message">⚠️ ${server.services.failed_count} service(s) failed</div>` : ''}
                            <div class="service-list">
                                ${server.services.systemd.map(svc =>
                                    `<div class="service-item ${svc.status === 'active' ? 'service-active' : 'service-inactive'}">
                                        ${svc.name}<br>
                                        <small>${svc.status}</small>
                                    </div>`
                                ).join('')}
                            </div>
                        </div>

                        ${server.vpn.xray.installed ? `
                        <div class="metric-group">
                            <div class="metric-title">🔐 VPN Status</div>
                            <div class="metric-row">
                                <span class="metric-label">Xray</span>
                                <span class="metric-value" style="color: ${server.vpn.xray.running === 'true' ? '#4CAF50' : '#f44336'}">
                                    ${server.vpn.xray.running === 'true' ? '✓ Running' : '✗ Stopped'}
                                </span>
                            </div>
                            ${server.vpn.wireguard.length > 0 ? `
                                <div class="metric-row">
                                    <span class="metric-label">WireGuard</span>
                                    <span class="metric-value">${server.vpn.wireguard.length} interface(s)</span>
                                </div>
                            ` : ''}
                        </div>
                        ` : ''}

                        ${server.critical_ports && server.critical_ports.length > 0 ? `
                        <div class="metric-group">
                            <div class="metric-title">🔌 Critical Ports</div>
                            <div class="port-list">
                                ${server.critical_ports.map(port =>
                                    `<div class="port-item port-critical" style="background: ${port.status === 'listening' ? 'rgba(76, 175, 80, 0.3)' : 'rgba(244, 67, 54, 0.3)'}; border-color: ${port.status === 'listening' ? '#4CAF50' : '#f44336'}">
                                        Port ${port.port}: ${port.status === 'listening' ? '✓' : '✗'}
                                    </div>`
                                ).join('')}
                            </div>
                        </div>
                        ` : ''}

                        <div class="metric-group">
                            <div class="metric-title">🌐 Network</div>
                            <div class="port-list">
                                ${server.network.listening_ports.slice(0, 10).map(port =>
                                    `<div class="port-item">${port}</div>`
                                ).join('')}
                                ${server.network.listening_ports.length > 10 ?
                                    `<div class="port-item">+${server.network.listening_ports.length - 10} more</div>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
