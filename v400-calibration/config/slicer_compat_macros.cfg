[gcode_macro EXCLUDE_OBJECT_DEFINE]
description: Ignore slicer exclude object define command
gcode:

[gcode_macro EXCLUDE_OBJECT_START]
description: Ignore slicer exclude object start command
gcode:

[gcode_macro EXCLUDE_OBJECT_END]
description: Ignore slicer exclude object end command
gcode:

[gcode_macro PRINT_START]
description: Turn on LEDs, home, and load the persisted default bed mesh
gcode:
    LED_ON
    SET_VELOCITY_LIMIT VELOCITY=400 ACCEL=8000 ACCEL_TO_DECEL=5000
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=5
    G90
    G28
    {% if "default" in printer.bed_mesh.profiles %}
        BED_MESH_PROFILE LOAD=default
        RESPOND TYPE=echo MSG="Loaded bed mesh profile: default"
    {% else %}
        RESPOND TYPE=echo MSG="No default bed mesh profile; printing without mesh"
    {% endif %}

[gcode_macro PRINT_END]
description: Turn off heaters and fan, then home the printer
gcode:
    TURN_OFF_HEATERS
    M107
    SET_VELOCITY_LIMIT VELOCITY=400 ACCEL=8000 ACCEL_TO_DECEL=5000
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=5
    G90
    G28
